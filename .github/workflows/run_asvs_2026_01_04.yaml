name: Run ASV
on:
#  pull_request:
#    branches:
#      - main
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: 3.13
  # Results and other data are stored away from the main branch.
  # This keeps the main branch clean and allows us to clear out
  # objects / history after being built up for long periods of time.
  BRANCH_NAME: shap_2026_07_14
  # Suppress cwd-on-sys.path so `python -m asv_runner` doesn't pick up the
  # unbuilt SHAP source checkout at the workspace root.
  PYTHONSAFEPATH: "1"

permissions:
  contents: read

jobs:
  run:
    name: Run ASV and push results
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: write
      # claim reports dead runs (expired leases) on a tracking issue.
      issues: write
    steps:
      - name: Checkout SHAP
        uses: actions/checkout@v6
        with:
          repository: shap/shap
          fetch-depth: 0

      - name: Checkout asv-runner results branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}
          path: asv-runner/

      # asv_runner scripts are run from the workflow's own ref (main on schedule,
      # whatever branch you choose on workflow_dispatch), not from whatever
      # stale copy lives on the storage branch. The storage branch is data-only.
      - name: Checkout asv-runner code
        uses: actions/checkout@v6
        with:
          path: asv-runner-code/

      - name: Claim next SHA
        id: claim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=asv-runner-code python -m asv_runner claim \
            --storage-dir=asv-runner \
            --repo-dir=. \
            --branch=$BRANCH_NAME

      - name: Setup Python
        if: steps.claim.outputs.new_commit == 'yes'
        uses: actions/setup-python@v6
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install SHAP and benchmark dependencies
        if: steps.claim.outputs.new_commit == 'yes'
        run: |
          pip install -U pip uv
          uv pip install --system . asv xgboost

      - name: Prepare ASV workspace
        if: steps.claim.outputs.new_commit == 'yes'
        run: |
          mkdir -p asv_bench
          jq \
            '.repo = ".." | .benchmark_dir = "../monitoring" | .html_dir = "html" | .results_dir = "results"' \
            asv.conf.json > asv_bench/asv.conf.json

      - name: Run ASV Benchmarks
        if: steps.claim.outputs.new_commit == 'yes'
        env:
          SHA: ${{ steps.claim.outputs.sha }}
        run: |
          PYTHONPATH=asv-runner-code python -m asv_runner benchmark \
            --asv-dir=asv_bench \
            --sha=$SHA

      - name: Push results
        if: steps.claim.outputs.new_commit == 'yes'
        env:
          SHA: ${{ steps.claim.outputs.sha }}
        run: |
          PYTHONPATH=asv-runner-code python -m asv_runner push \
            --storage-dir=asv-runner \
            --asv-dir=asv_bench \
            --sha=$SHA \
            --branch=$BRANCH_NAME
